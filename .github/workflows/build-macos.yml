name: Build macOS

on:
  workflow_call:
    inputs:
      version:
        description: Version supplied by the shared release workflow
        required: true
        type: string
      publish_release:
        description: Sign and notarize the application
        required: true
        type: boolean
    secrets:
      MACOS_CODESIGN_IDENTITY:
        required: false
      MACOS_CERTIFICATE_BASE64:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_NOTARY_APPLE_ID:
        required: false
      MACOS_NOTARY_PASSWORD:
        required: false
      MACOS_NOTARY_TEAM_ID:
        required: false
  workflow_dispatch:
    inputs:
      publish_release:
        description: Sign and notarize the standalone build
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13.13"

jobs:
  build:
    name: macOS arm64
    runs-on: macos-15

    steps:
      - name: Checkout source revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve and validate shared version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          source_version=$(python -c 'import re,pathlib; source=pathlib.Path("KirstGrab.py").read_text(encoding="utf-8"); print(re.search(r"^CURRENT_VERSION = \"([^\"]+)\"", source, re.M).group(1))')
          release_version=${REQUESTED_VERSION:-$source_version}
          if [ "$release_version" != "$source_version" ]; then
            echo "Requested version $release_version does not match CURRENT_VERSION $source_version" >&2
            exit 1
          fi
          echo "value=$release_version" >> "$GITHUB_OUTPUT"

      - name: Validate source
        run: |
          python -m py_compile KirstGrab.py kirstgrab_platform.py scripts/verify_macos_bundle.py
          python -m unittest discover -s tests -v
          python -c 'import tkinter; print(f"Tk {tkinter.TkVersion}")'
          test "$(uname -m)" = "arm64"

      - name: Build and test ad-hoc-signed app
        env:
          KIRSTGRAB_REFRESH_HOMEBREW: "1"
        run: bash ./build-local-macos.sh --version "${{ steps.version.outputs.value }}"

      - name: Require complete Apple signing configuration
        if: ${{ inputs.publish_release }}
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          test -n "$SIGNING_IDENTITY"
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$NOTARY_APPLE_ID"
          test -n "$NOTARY_PASSWORD"
          test -n "$NOTARY_TEAM_ID"

      - name: Import Developer ID certificate
        if: ${{ inputs.publish_release }}
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/kirstgrab-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          CERTIFICATE_PATH="$RUNNER_TEMP/kirstgrab-certificate.p12"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

      - name: Sign verified app with Developer ID
        if: ${{ inputs.publish_release }}
        env:
          KIRSTGRAB_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          codesign --force --deep --sign "$KIRSTGRAB_CODESIGN_IDENTITY" --options runtime --timestamp --entitlements macos-entitlements.plist dist/KirstGrab.app
          codesign --verify --deep --strict --verbose=2 dist/KirstGrab.app
          ARCHIVE="KirstGrab-$RELEASE_VERSION-macos-arm64.zip"
          rm -f "$ARCHIVE"
          ditto -c -k --sequesterRsrc --keepParent dist/KirstGrab.app "$ARCHIVE"

      - name: Notarize and staple app
        if: ${{ inputs.publish_release }}
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          ARCHIVE="KirstGrab-$RELEASE_VERSION-macos-arm64.zip"
          xcrun notarytool submit "$ARCHIVE" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple dist/KirstGrab.app
          xcrun stapler validate dist/KirstGrab.app
          spctl --assess --type execute --verbose=4 dist/KirstGrab.app
          rm -f "$ARCHIVE"
          ditto -c -k --sequesterRsrc --keepParent dist/KirstGrab.app "$ARCHIVE"

      - name: Remove signing keychain
        if: ${{ always() && inputs.publish_release }}
        run: |
          security delete-keychain "$RUNNER_TEMP/kirstgrab-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/kirstgrab-certificate.p12"

      - name: Upload macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: KirstGrab-${{ steps.version.outputs.value }}-macos-arm64.zip
          if-no-files-found: error
