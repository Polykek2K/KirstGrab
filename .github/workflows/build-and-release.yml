name: Build and Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platforms to build and publish
        required: true
        type: choice
        options:
          - all
          - windows
          - macos
        default: all
      publish_release:
        description: Sign, notarize, tag, and publish the release from main
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve shared version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Require main for publication
        if: ${{ inputs.publish_release && github.ref != 'refs/heads/main' }}
        run: |
          echo "Official releases must be dispatched from main." >&2
          exit 1

      - name: Checkout source revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read CURRENT_VERSION
        id: version
        run: |
          version=$(python3 -c 'import re,pathlib; source=pathlib.Path("KirstGrab.py").read_text(encoding="utf-8"); print(re.search(r"^CURRENT_VERSION = \"([^\"]+)\"", source, re.M).group(1))')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid CURRENT_VERSION: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows
    if: ${{ inputs.target == 'all' || inputs.target == 'windows' }}
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  build-macos:
    name: Build macOS
    if: ${{ inputs.target == 'all' || inputs.target == 'macos' }}
    needs: prepare
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      publish_release: ${{ inputs.publish_release }}
    secrets: inherit

  release:
    name: Publish release
    if: >-
      ${{
        always() &&
        inputs.publish_release &&
        needs.prepare.result == 'success' &&
        (inputs.target == 'macos' || needs.build-windows.result == 'success') &&
        (inputs.target == 'windows' || needs.build-macos.result == 'success')
      }}
    needs:
      - prepare
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: Verify release set
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          case "$RELEASE_TARGET" in
            all)
              test -f "release-files/release-$RELEASE_VERSION.zip"
              test -f "release-files/KirstGrab-$RELEASE_VERSION-macos-arm64.zip"
              ;;
            windows)
              test -f "release-files/release-$RELEASE_VERSION.zip"
              ;;
            macos)
              test -f "release-files/KirstGrab-$RELEASE_VERSION-macos-arm64.zip"
              ;;
            *)
              echo "Unsupported release target: $RELEASE_TARGET" >&2
              exit 1
              ;;
          esac
          sha256sum release-files/*.zip

      - name: Create or verify Git tag
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git rev-parse "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            tag_commit=$(git rev-list -n 1 "$RELEASE_VERSION")
            head_commit=$(git rev-parse HEAD)
            if [ "$tag_commit" != "$head_commit" ]; then
              echo "Tag $RELEASE_VERSION points to $tag_commit instead of $head_commit" >&2
              exit 1
            fi
            echo "Tag $RELEASE_VERSION already points to this commit"
          else
            git tag "$RELEASE_VERSION"
            git push origin "$RELEASE_VERSION"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Release ${{ needs.prepare.outputs.version }}
          files: release-files/*.zip
          fail_on_unmatched_files: true
          overwrite_files: true
