name: Build Windows

on:
  workflow_call:
    inputs:
      version:
        description: Version supplied by the shared release workflow
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  build:
    name: Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout source revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve and validate shared version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $sourceVersion = python -c 'import re,pathlib; source=pathlib.Path("KirstGrab.py").read_text(encoding="utf-8"); print(re.search(r"^CURRENT_VERSION = \"([^\"]+)\"", source, re.M).group(1))'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read CURRENT_VERSION' }
          $releaseVersion = $env:REQUESTED_VERSION
          if ([string]::IsNullOrWhiteSpace($releaseVersion)) { $releaseVersion = $sourceVersion }
          if ($releaseVersion -ne $sourceVersion) { throw "Requested version $releaseVersion does not match CURRENT_VERSION $sourceVersion" }
          "value=$releaseVersion" >> $env:GITHUB_OUTPUT

      - name: Install latest Python build dependencies
        run: |
          python -m pip install --upgrade --disable-pip-version-check --only-binary=:all: pyinstaller pyinstaller-hooks-contrib pillow

      - name: Validate source
        run: |
          python -m py_compile KirstGrab.py kirstgrab_platform.py scripts/verify_sha256.py
          python -m unittest discover -s tests -v

      - name: Download latest yt-dlp
        run: |
          $base = 'https://github.com/yt-dlp/yt-dlp/releases/latest/download'
          Invoke-WebRequest "$base/yt-dlp.exe" -OutFile yt-dlp.exe
          Invoke-WebRequest "$base/SHA2-256SUMS" -OutFile yt-dlp.sha256
          python scripts/verify_sha256.py yt-dlp.exe yt-dlp.sha256 --entry yt-dlp.exe
          $versionOutput = @(& .\yt-dlp.exe --version)
          if ($LASTEXITCODE -ne 0 -or $versionOutput.Count -eq 0) { throw 'Could not read the downloaded yt-dlp version' }
          "KIRSTGRAB_YT_DLP_VERSION=$($versionOutput[0].Trim())" >> $env:GITHUB_ENV

      - name: Download latest Deno
        run: |
          $asset = 'deno-x86_64-pc-windows-msvc.zip'
          $base = 'https://github.com/denoland/deno/releases/latest/download'
          Invoke-WebRequest "$base/$asset" -OutFile deno.zip
          Invoke-WebRequest "$base/$asset.sha256sum" -OutFile deno.sha256
          python scripts/verify_sha256.py deno.zip deno.sha256 --entry $asset
          Expand-Archive deno.zip deno_tmp
          New-Item -ItemType Directory -Force -Path .\deno | Out-Null
          Copy-Item deno_tmp\deno.exe .\deno\deno.exe -Force
          $versionOutput = @(& .\deno\deno.exe --version)
          if ($LASTEXITCODE -ne 0 -or $versionOutput.Count -eq 0) { throw 'Could not read the downloaded Deno version' }
          $version = ($versionOutput[0] -replace '^deno\s+', '').Trim()
          "KIRSTGRAB_DENO_VERSION=$version" >> $env:GITHUB_ENV

      - name: Download latest FFmpeg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest' -Headers $headers
          $assetName = 'ffmpeg-master-latest-win64-gpl-shared.zip'
          $matchingAssets = @($rel.assets | Where-Object { $_.name -eq $assetName })
          if ($matchingAssets.Count -ne 1) { throw "Expected one FFmpeg asset named $assetName, found $($matchingAssets.Count)" }
          $asset = $matchingAssets[0]
          if ($asset.digest -notmatch '^sha256:(?<hash>[0-9a-f]{64})$') { throw 'FFmpeg asset has no SHA-256 digest' }
          $expectedDigest = $Matches['hash']
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ffmpeg.zip
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath ffmpeg.zip).Hash.ToLowerInvariant()
          if ($actual -ne $expectedDigest) { throw 'FFmpeg SHA-256 verification failed' }
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp
          $archiveRoots = @([System.IO.Directory]::GetDirectories((Resolve-Path -LiteralPath ffmpeg_tmp).Path))
          if ($archiveRoots.Count -ne 1) { throw "Expected one FFmpeg archive root, found $($archiveRoots.Count)" }
          $binDirectory = Join-Path $archiveRoots[0] 'bin'
          $ff = Join-Path $binDirectory 'ffmpeg.exe'
          $ffp = Join-Path $binDirectory 'ffprobe.exe'
          if (-not (Test-Path -LiteralPath $ff) -or -not (Test-Path -LiteralPath $ffp)) { throw 'FFmpeg executables were not found in the archive' }
          New-Item -ItemType Directory -Force -Path .\ffmpeg | Out-Null
          Copy-Item -LiteralPath $ff -Destination .\ffmpeg\ffmpeg.exe -Force
          Copy-Item -LiteralPath $ffp -Destination .\ffmpeg\ffprobe.exe -Force
          $dlls = @([System.IO.Directory]::GetFiles($binDirectory, '*.dll', [System.IO.SearchOption]::TopDirectoryOnly))
          if ($dlls.Count -eq 0) { throw 'FFmpeg DLL files were not found in the archive' }
          $dlls | ForEach-Object {
            Copy-Item -LiteralPath $_ -Destination .\ffmpeg\ -Force
          }
          $versionOutput = @(& .\ffmpeg\ffmpeg.exe -version)
          if ($LASTEXITCODE -ne 0 -or $versionOutput.Count -eq 0) { throw 'Could not read the downloaded FFmpeg version' }
          "KIRSTGRAB_FFMPEG_VERSION=$($versionOutput[0].Trim())" >> $env:GITHUB_ENV
          "KIRSTGRAB_FFMPEG_RELEASE=$($rel.tag_name)" >> $env:GITHUB_ENV

      - name: Record resolved build versions
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $pythonVersion = python -c 'import platform; print(platform.python_version())'
          $pyinstallerVersion = python -c 'import PyInstaller; print(PyInstaller.__version__)'
          $pillowVersion = python -c 'import PIL; print(PIL.__version__)'
          @(
            "KirstGrab=$env:RELEASE_VERSION"
            'target=Windows-x86_64'
            "python=$pythonVersion"
            "pyinstaller=$pyinstallerVersion"
            "pillow=$pillowVersion"
            "yt-dlp=$env:KIRSTGRAB_YT_DLP_VERSION"
            "deno=$env:KIRSTGRAB_DENO_VERSION"
            "ffmpeg-release=$env:KIRSTGRAB_FFMPEG_RELEASE"
            "ffmpeg=$env:KIRSTGRAB_FFMPEG_VERSION"
            ''
            '[Python packages]'
          ) | Set-Content -LiteralPath BUILD-MANIFEST.txt -Encoding utf8
          python -m pip freeze | Add-Content -LiteralPath BUILD-MANIFEST.txt -Encoding utf8
          Add-Content -LiteralPath BUILD-MANIFEST.txt -Value "`n[FFmpeg build]" -Encoding utf8
          & .\ffmpeg\ffmpeg.exe -version | Add-Content -LiteralPath BUILD-MANIFEST.txt -Encoding utf8

      - name: Build executable
        run: |
          $arguments = @(
            '-F', '--windowed', 'KirstGrab.py',
            '--distpath', 'dist',
            '--workpath', 'build',
            '--noconfirm',
            '--icon', 'icon.ico',
            '--add-data', 'images/background.png;images',
            '--add-data', 'fonts/m6x11plus.ttf;fonts',
            '--add-data', 'icon.ico;.',
            '--add-data', 'LICENSE;.',
            '--add-data', 'THIRD_PARTY_NOTICES.md;.',
            '--add-data', 'BUILD-MANIFEST.txt;.',
            '--add-binary', 'yt-dlp.exe;bin',
            '--add-binary', 'ffmpeg\ffmpeg.exe;bin',
            '--add-binary', 'ffmpeg\ffprobe.exe;bin',
            '--add-binary', 'ffmpeg\*.dll;bin',
            '--add-binary', 'deno\deno.exe;bin\deno'
          )
          & pyinstaller $arguments
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed with exit code $LASTEXITCODE" }
          & .\dist\KirstGrab.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "KirstGrab self-test failed with exit code $LASTEXITCODE" }

      - name: Prepare Windows archive
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $exe = Get-Item -LiteralPath dist\KirstGrab.exe
          Compress-Archive -Path $exe.FullName,LICENSE,THIRD_PARTY_NOTICES.md,BUILD-MANIFEST.txt -DestinationPath "release-$env:RELEASE_VERSION.zip" -Force

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: release-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
